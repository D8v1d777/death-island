name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.7
        with:
          path: ./
          extra_args: --only-verified

  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/check.py
      - name: Render smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python3 tools/check.py --render-only
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/

  build-android:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-34' 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build and verify debug APK
        run: python3 tools/build_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: death-island-debug-apk
          path: build/death-island-debug.apk
          if-no-files-found: error
          retention-days: 14
