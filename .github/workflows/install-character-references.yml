name: Install character reference images

on:
  push:
    paths:
      - ".github/character-source/*.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-character-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Decode and commit the character references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/assets/illustrated
          base64 --decode .github/character-source/DAVE_PRODUCTION_CHARACTER_BIBLE.jpg.b64 > src/assets/illustrated/DAVE_PRODUCTION_CHARACTER_BIBLE.jpg
          base64 --decode .github/character-source/MARIE_PRODUCTION_CHARACTER_BIBLE.jpg.b64 > src/assets/illustrated/ELLIE_PRODUCTION_CHARACTER_BIBLE.jpg
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              "DAVE_PRODUCTION_CHARACTER_BIBLE.jpg",
              "ELLIE_PRODUCTION_CHARACTER_BIBLE.jpg",
          ):
              data = (Path("src/assets/illustrated") / name).read_bytes()
              if not data.startswith(bytes.fromhex("FFD8FF")) or len(data) < 1000:
                  raise SystemExit(f"Invalid JPEG output: {name}")
              print(f"Verified {name}: {len(data)} bytes")
          PY
          git rm .github/character-source/DAVE_PRODUCTION_CHARACTER_BIBLE.jpg.b64
          git rm .github/character-source/MARIE_PRODUCTION_CHARACTER_BIBLE.jpg.b64
          git rm .github/workflows/install-character-references.yml
          git add src/assets/illustrated/DAVE_PRODUCTION_CHARACTER_BIBLE.jpg
          git add src/assets/illustrated/ELLIE_PRODUCTION_CHARACTER_BIBLE.jpg
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets: add Dave and replace mistaken female reference with Marie"
          git push origin HEAD:master
