name: Setup Godot
description: Install the pinned Godot 4.3 editor and matching export templates.
runs:
  using: composite
  steps:
    - name: Cache engine and templates
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/godot
          ~/.local/share/godot/export_templates/4.3.stable
        key: godot-4.3-stable-linux-x86_64-v2
    - name: Download and verify official artifacts
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        BASE=https://github.com/godotengine/godot-builds/releases/download/4.3-stable
        mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates"
        cd "$RUNNER_TEMP/godot"
        curl --fail --location --retry 3 "$BASE/SHA512-SUMS.txt" -o SHA512-SUMS.txt
        curl --fail --location --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o Godot_v4.3-stable_linux.x86_64.zip
        curl --fail --location --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o Godot_v4.3-stable_export_templates.tpz
        sha512sum --check --ignore-missing SHA512-SUMS.txt
        unzip -q Godot_v4.3-stable_linux.x86_64.zip
        install -m 755 Godot_v4.3-stable_linux.x86_64 "$HOME/.local/bin/godot"
        unzip -q Godot_v4.3-stable_export_templates.tpz
        mv templates "$HOME/.local/share/godot/export_templates/4.3.stable"
    - name: Add engine to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
